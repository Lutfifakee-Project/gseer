# WordPress via the X-Pingback response header — the XML-RPC pingback
# endpoint WordPress core emits on every stock installation
# (X-Pingback: <site>/xmlrpc.php; documented WordPress default header).
# A header fact is stronger than a body marker: it is set by the CMS
# itself, not page content that could be copied.
id: cms-wordpress-header
family: cms
product: wordpress
confidence: 0.9
provenance: |
  WordPress core sends `X-Pingback: <site>/xmlrpc.php` on every stock
  page (documented default).  The header names the pingback endpoint —
  presence of the X-Pingback header with the xmlrpc.php endpoint is
  the header-is-product tier (>= 0.9 per docs/RULES.md §4).
matches:
  - field: http.headers
    pattern: '(?m)^X-Pingback: .*/xmlrpc\.php$'
    weight: 0.9
tests:
  - evidence: {http: {headers: "Server: nginx\nX-Pingback: https://example.test/xmlrpc.php"}}
    match: true
  - evidence: {http: {headers: "Server: nginx\nX-Powered-By: PHP/8.2"}}
    match: false
  - evidence: {http: {headers: "Link: </wp-content>; rel=preload"}}
    match: false
