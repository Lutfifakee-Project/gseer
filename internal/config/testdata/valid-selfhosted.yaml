# Valid self-hosted config for the M2 tests (CLI-only architecture:
# server.*/client.*/index.* keys were removed with the API surfaces).
profile: self-hosted

database:
  host: "127.0.0.1"
  port: 5432
  user: "gseer"
  password: "test-password"
  name: "gseer"
  sslmode: "disable"

policy:
  evaluation_fixtures: false

log:
  level: "info"
  format: "text"

sources:
  - name: "dns-test"
    type: "dns"
    enabled: false

defaults:
  search_mode: "service"
