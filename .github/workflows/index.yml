# GSEER shared-index pipeline — scheduled cumulative discovery → publication.
#
# The provider-side half of the approved shared-index architecture
# (docs/SHARED-INDEX.md).  Runs on the project (provider) side:
#
#   resolve the channel state (pipeline/resolve-sequence.sh, fail-closed)
#     → restore the verified cumulative base
#     → incremental discovery (reviewed-enabled connectors only)
#     → merge/dedupe through the standard upsert contracts
#     → ASN enrichment
#     → [gated] authorized HTTP/TLS observation (default-deny preserved)
#     → snapshot build → validation → Ed25519 signature
#     → ATOMIC publication (pipeline/publish.sh: snapshot → retrieve-
#       verify → anti-rollback gate → pointer manifest → re-verify)
#
# Channel-state model (pipeline/resolve-sequence.sh) — exactly ONE of:
#   boot        the release is CONFIRMED absent (release view AND the
#               releases API agree; an unreachable API is FATAL, never a
#               bootstrap) — sequence 1, fresh scan.  The ONLY bootstrap
#               path.
#   cumulative  pointer manifest + snapshot artifact retrieved and fully
#               verified (signature → checksum → sequence → schema →
#               integrity → counts) before anything is restored.
#   fresh       ONLY via the explicit owner-dispatched force_fresh input;
#               NEVER an automatic fallback.  Monotonic numbering kept.
#
# Never: silently reset the sequence to 1, downgrade or reuse a
# published sequence, publish from an unverifiable base, or advance the
# pointer to an unverified artifact (pipeline/publish.sh enforces the
# atomic order; a failed snapshot upload leaves the pointer untouched).
#
# Security:
#   - least-privilege: contents:write ONLY (the release upload).
#   - the build step VALIDATES INDEX_PUB_B64 (base64, 32 bytes) and
#     ASSERTS it is embedded in BOTH binaries (grep -a) — the test
#     anchor in internal/index/keys.go can never silently become the
#     production trust anchor.
#   - the signing key lives in secrets.INDEX_SIGNING_KEY (base64
#     Ed25519 private key from `gseer-provider keygen`) and is written
#     to a 0600 runner temp file — it is never echoed, committed, or
#     embedded.
#   - the release is created with --latest=false so binary releases
#     remain the headline "Latest" release.
#   - active observation runs ONLY when pipeline/scopes.txt is
#     committed (the owner's explicit, per-target authorization);
#     otherwise this pipeline is 100% passive.

name: shared-index

on:
  schedule:
    - cron: "0 3 * * 1" # weekly — Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      force_fresh:
        description: "Recovery escape hatch (EXPLICIT owner action): skip the cumulative restore and publish a fresh-scan sequence; monotonic numbering is kept"
        type: boolean
        default: false

permissions:
  contents: write # the `shared-index` release upload only

concurrency:
  group: shared-index
  cancel-in-progress: false

env:
  GSEER_HOME: ${{ github.workspace }}/.gseer-home

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Build the CLI and provider tools (production anchor embedded and verified)
        env:
          INDEX_PUB_B64: ${{ secrets.INDEX_PUB_B64 }}
        run: |
          set -euo pipefail
          python3 - "$INDEX_PUB_B64" <<'PYKEY'
          import base64, sys
          try:
              key = base64.b64decode(sys.argv[1], validate=True)
          except Exception:
              sys.exit("ERROR: INDEX_PUB_B64 is not valid base64")
          if len(key) != 32:
              sys.exit("ERROR: INDEX_PUB_B64 must decode to 32 bytes")
          PYKEY
          INDEX_LDFLAGS="-X github.com/Lutfifakee-Project/gseer/internal/index.EmbeddedIndexPublicKeyB64=$INDEX_PUB_B64"
          go build -ldflags "$INDEX_LDFLAGS" -o ./build/gseer ./cmd/gseer
          go build -ldflags "$INDEX_LDFLAGS" -o ./build/gseer-provider ./cmd/gseer-provider
          # Trust-anchor consistency (remediation §3): the production
          # public key MUST be embedded in BOTH binaries.  A missing
          # anchor would leave the in-repo TEST anchor as the effective
          # trust root — refuse to run.
          for BIN in ./build/gseer ./build/gseer-provider; do
            if ! grep -aqF -- "$INDEX_PUB_B64" "$BIN"; then
              echo "FATAL: the production trust anchor is NOT embedded in $BIN" >&2
              exit 1
            fi
            echo "[ ok ] production anchor embedded: $BIN"
          done

      - name: Resolve the channel state and verify the cumulative base (fail-closed)
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FRESH: ${{ inputs.force_fresh || 'false' }}
          WORKDIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash pipeline/resolve-sequence.sh 2>&1 | tee resolve.log
          grep -E '^(RESTORE_MODE|PREV_SEQ|SEQ)=' resolve.log >> "$GITHUB_ENV"

      - name: Restore the cumulative base (the verified previous snapshot IS the working store)
        if: env.RESTORE_MODE == 'cumulative'
        run: |
          set -euo pipefail
          mkdir -p "$GSEER_HOME"
          cp "prev/gseer-index-${PREV_SEQ}.db" "$GSEER_HOME/store.db"
          chmod 600 "$GSEER_HOME/store.db"
          echo "[ok ] cumulative base installed as the working store (sequence $PREV_SEQ facts restored verbatim, provenance intact)"

      - name: Discovery pipeline (passive connectors, seeds from pipeline/seeds)
        run: |
          set -euo pipefail
          SEEDS=$(grep -v '^#' pipeline/seeds/domains.txt | grep -v '^$' | paste -sd, -)
          ./build/gseer setup --personal --db-path "$GSEER_HOME/store.db"
          ./build/gseer source add pipeline-dns --type dns --seeds "$SEEDS" --enable --yes
          ./build/gseer collect run --source pipeline-dns

          # Enrich every discovered IP (restored + newly discovered):
          # Team Cymru IP2ASN (ASN/org/country) and reverse DNS — both
          # reviewed-enabled connectors.  Enrichment upserts merge
          # (COALESCE), so re-running on restored facts is idempotent.
          IPS=$(./build/gseer search 'asset_kind == "ip"' --output json \
                | python3 -c 'import json,sys; d=json.load(sys.stdin); print(",".join(r["asset_value"] for r in d["rows"]))')
          if [ -n "$IPS" ]; then
            ./build/gseer source add pipeline-ip2asn --type ip2asn --seeds "$IPS" --resolver 1.1.1.1:53 --enable --yes
            ./build/gseer collect run --source pipeline-ip2asn
            ./build/gseer source add pipeline-ptr --type ptr --seeds "$IPS" --resolver 1.1.1.1:53 --enable --yes
            ./build/gseer collect run --source pipeline-ptr
          fi

      - name: Authorized observation (runs ONLY when the owner committed pipeline/scopes.txt)
        run: |
          set -euo pipefail
          if [ ! -f pipeline/scopes.txt ]; then
            echo "[skip] no pipeline/scopes.txt committed — this run is 100% passive"
            exit 0
          fi
          while IFS='|' read -r KIND VALUE PROTOCOLS PORTS; do
            [ -z "${KIND// }" ] && continue
            case "$KIND" in \#*) continue ;; esac
            ./build/gseer scope add "$KIND" "$VALUE" --protocols "$PROTOCOLS" --ports "$PORTS" \
              --note "provider-pipeline authorized scope (committed by the owner)"
            IFS=',' read -r -a PROTOCOL_LIST <<< "$PROTOCOLS"
            IFS=',' read -r -a PORT_LIST <<< "$PORTS"

            for P in "${PROTOCOL_LIST[@]}"; do
              P="${P//[[:space:]]/}"
              case "$P" in
                http|tls) ;;
                *)
                  echo "[error] unsupported observation protocol: $P" >&2
                  exit 1
                  ;;
              esac

              for PORT in "${PORT_LIST[@]}"; do
                PORT="${PORT//[[:space:]]/}"
                [[ "$PORT" =~ ^[0-9]+$ ]] || {
                  echo "[error] invalid authorized port: $PORT" >&2
                  exit 1
                }

                ./build/gseer scan "$P" --target "$VALUE" --port "$PORT"
              done
            done
          done < pipeline/scopes.txt
          # One observation per scope target, gateway-enforced and audited
          # (gseer scope audit).  Fingerprint enrichment is attached by the
          # scan path itself (v0.3.2).

      - name: Build, validate, sign, and pre-verify the snapshot
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$INDEX_SIGNING_KEY" > "$RUNNER_TEMP/index-signing.key"
          chmod 600 "$RUNNER_TEMP/index-signing.key"
          ARTIFACT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/shared-index/gseer-index-${SEQ}.db"
          ./build/gseer-provider build    -store "$GSEER_HOME/store.db" \
                                          -out "snapshot/gseer-index-${SEQ}.db"
          ./build/gseer-provider manifest -snapshot "snapshot/gseer-index-${SEQ}.db" \
                                          -sequence "$SEQ" \
                                          -artifact-url "$ARTIFACT_URL" \
                                          -tool-version "v0.3.2" \
                                          -key "$RUNNER_TEMP/index-signing.key" \
                                          -out "snapshot/gseer-index-manifest.json"
          rm -f "$RUNNER_TEMP/index-signing.key"
          ./build/gseer-provider verify -manifest snapshot/gseer-index-manifest.json \
                                        -artifact "snapshot/gseer-index-${SEQ}.db"

      - name: Atomic publication (snapshot → retrieve-verify → anti-rollback → pointer)
        env:
          GH_TOKEN: ${{ github.token }}
          WORKDIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash pipeline/publish.sh 2>&1 | tee publish.log
          grep -q '^PUBLISH_OK ' publish.log
